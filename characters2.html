<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CAGE — character mockups v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0b0b0b;color:#e8e2d4;font-family:Georgia,serif}
header{text-align:center;padding:26px 10px 8px}h1{margin:0;font-weight:400;letter-spacing:12px;font-size:40px}
.sub{color:#9d9686;font-style:italic;margin-top:6px}
.bar{text-align:center;margin:14px 0 4px}.bar button{background:#1a1a1a;color:#e8e2d4;border:1px solid #444;padding:6px 14px;margin:0 3px;font-family:inherit;cursor:pointer;border-radius:3px}
.bar button.on{background:#e8e2d4;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;padding:18px;max-width:1240px;margin:0 auto}
.card{background:#141414;border:1px solid #262626;border-radius:6px;overflow:hidden}
.card canvas{display:block;width:100%;aspect-ratio:380/300}
.meta{padding:10px 14px 14px}.ch{font-size:11px;letter-spacing:4px;color:#8f897a}.nm{font-size:20px;margin:3px 0}.film{font-style:italic;color:#b9b2a2;font-size:14px}.nt{font-size:13px;color:#a39d8e;margin-top:6px;line-height:1.4}
footer{text-align:center;color:#6f6a5e;font-size:12px;font-style:italic;padding:10px 0 30px}
</style></head><body>
<header><h1>CAGE</h1><div class="sub">Character mockups v2 — full-color, face-forward Nicolas Cages, one per chapter</div></header>
<div class="bar"><button data-m="auto" class="on">Auto cycle</button><button data-m="idle">Idle</button><button data-m="run">Run</button><button data-m="jump">Jump</button><button data-m="push">Push</button></div>
<div class="grid" id="g"></div>
<footer>Big figure = 4× zoom. Bottom-right = in-game size on a 1080p screen. Characters are full color; the world stays Limbo-dark. Same 22×54 hitbox, so gameplay doesn’t change. Unofficial parody.</footer>
<script>
// ============================================================
//  CAGE v2 hero rig — painted caricature heads + full-color vector bodies
//  drawHero(ctx, key, s): s = {x (center), y (hitbox top), face, vx, vy, onGround, anim, t, pushing}
//  Hitbox unchanged (22 x 54); the big head pokes ~12 units above it.
// ============================================================
const HEAD_IMG={};
function loadHeads(data){for(const k in data){const im=new Image();im.src=data[k].src;HEAD_IMG[k]={img:im,w:data[k].w,h:data[k].h};}}
const OL='#1b130e';
const HEROES={
 conair:{name:'Cameron Poe',film:'Con Air',notes:'Flowing mullet, sweat-stained white tank top, bare arms, faded jeans and boots — never lets go of the bunny.',
  head:{h:35,ax:0.47,ay:0.92},skin:'#e2a57f',skinD:'#bf805f',sleeve:null,pants:'#3d5d8f',pantsD:'#2c4469',shoe:'#5b3a22',
  torso(c,s){torsoPath(c,-7.5,17,7.8,36);fillG(c,'#e2a57f','#bf805f',-7.5,7.8);c.fill();c.stroke();
   c.beginPath();c.moveTo(-6.4,19.5);c.lineTo(-3.8,17.2);c.quadraticCurveTo(-1,22,2.6,21.4);c.lineTo(4.4,17.2);c.lineTo(6.9,19.5);c.lineTo(7.6,33.5);c.lineTo(-7.2,33.5);c.closePath();fillG(c,'#f6f2e9','#cdc5b4',-7,7.6);c.fill();c.stroke();
   c.fillStyle='rgba(150,120,60,0.25)';c.beginPath();c.ellipse(1.5,27,3.2,4.2,0,0,6.3);c.fill();
   c.fillStyle='#6b4423';c.fillRect(-7.3,33,15,2.6);c.strokeRect(-7.3,33,15,2.6);c.fillStyle='#d8b25a';c.fillRect(0,33.4,2.4,1.8);},
  frontItem(c,hx,hy,s){bunny(c,hx,hy,s);}},
 treasure:{name:'Benjamin Franklin Gates',film:'National Treasure',notes:'Side-parted hair, Franklin’s multi-lens spectacles, brown suede jacket over a tan shirt — the Declaration rolled up in his fist.',
  head:{h:34,ax:0.5,ay:0.92},skin:'#e8b08c',skinD:'#c48c6a',sleeve:'#8a5a34',sleeveD:'#6a4325',pants:'#3a3f4f',pantsD:'#2a2e3b',shoe:'#4a2f1d',
  torso(c,s){torsoPath(c,-7.8,17,8,36);fillG(c,'#9a6a40','#6a4325',-7.8,8);c.fill();c.stroke();
   c.beginPath();c.moveTo(-1.4,17.3);c.lineTo(4.4,17.3);c.lineTo(3.4,35.6);c.lineTo(-0.6,35.6);c.closePath();c.fillStyle='#d2bf98';c.fill();c.stroke();
   c.strokeStyle='#5a381d';c.lineWidth=0.7;c.beginPath();c.moveTo(-1.4,17.3);c.lineTo(-3.5,24);c.lineTo(-0.4,26);c.moveTo(4.4,17.3);c.lineTo(6.2,24);c.lineTo(3.6,26);c.stroke();c.lineWidth=1.1;c.strokeStyle=OL;},
  frontItem(c,hx,hy,s){c.save();c.translate(hx,hy);c.rotate(-0.6+Math.sin(s.t*2)*0.05);c.fillStyle='#e3cf9e';c.fillRect(-2.2,-9,4.4,15);c.strokeRect(-2.2,-9,4.4,15);c.fillStyle='#f3e6c2';c.beginPath();c.ellipse(0,-9,2.2,1.1,0,0,6.3);c.fill();c.stroke();c.fillStyle='#a3242a';c.fillRect(-2.3,-2,4.6,2);c.restore();}},
 wicker:{name:'Edward Malus',film:'The Wicker Man',notes:'The bear suit, hood pushed back so you can see the panic. When he stands still the bees find him — and he flails.',
  head:{h:37,ax:0.55,ay:0.9},skin:'#e0a27c',skinD:'#bb7d5d',sleeve:'#7a4e2c',sleeveD:'#5a3820',pants:'#7a4e2c',pantsD:'#5a3820',shoe:'#3b2414',limbW:6.4,fur:true,bees:true,
  torso(c,s){c.beginPath();const n=26;for(let i=0;i<=n;i++){const a=i/n*6.283,r=(i%2?10:9)+Math.sin(s.t*8+i)*0.2;const x=0.3+Math.cos(a)*r*0.92,y=27+Math.sin(a)*r*1.05;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();fillG(c,'#8a5a34','#5a3820',-9,9);c.fill();c.stroke();
   c.fillStyle='#b88a5c';c.beginPath();c.ellipse(2.2,28,4.6,6,0,0,6.3);c.fill();c.strokeStyle='rgba(60,35,15,0.6)';c.lineWidth=0.6;c.setLineDash([1,1]);c.beginPath();c.ellipse(2.2,28,4.6,6,0,0,6.3);c.stroke();c.setLineDash([]);c.lineWidth=1.1;c.strokeStyle=OL;}},
 sixty:{name:'Memphis Raines',film:'Gone in 60 Seconds',notes:'Bleached spiky crop and goatee, beat-up brown leather jacket, charcoal tee, dark jeans — twirling Eleanor’s keys.',
  head:{h:35,ax:0.52,ay:0.92},skin:'#e3a885',skinD:'#bf8463',sleeve:'#6b4123',sleeveD:'#4c2c17',pants:'#2f3c56',pantsD:'#222c40',shoe:'#1d1d1f',
  torso(c,s){torsoPath(c,-8,17,8.2,36.2);fillG(c,'#7d4e2c','#4c2c17',-8,8.2);c.fill();c.stroke();
   c.beginPath();c.moveTo(-0.8,17.5);c.lineTo(5,17.5);c.lineTo(3.8,36);c.lineTo(0.2,36);c.closePath();c.fillStyle='#3a3a40';c.fill();c.stroke();
   c.fillStyle='#8d5c35';c.beginPath();c.moveTo(-6.5,16.5);c.lineTo(-1.2,15);c.lineTo(0.6,22);c.closePath();c.fill();c.stroke();c.beginPath();c.moveTo(6.6,16.5);c.lineTo(3.6,15);c.lineTo(6,22.5);c.closePath();c.fill();c.stroke();
   c.strokeStyle='rgba(255,220,180,0.35)';c.lineWidth=0.6;c.beginPath();c.moveTo(-6,24);c.lineTo(-2.5,24.5);c.moveTo(-6.6,29);c.lineTo(-3,29.4);c.stroke();c.lineWidth=1.1;c.strokeStyle=OL;},
  frontItem(c,hx,hy,s){c.save();c.translate(hx,hy+1.5);c.rotate(s.t*10);c.strokeStyle='#c9c9c9';c.lineWidth=0.9;c.beginPath();c.arc(0,2.6,2.4,0,6.3);c.stroke();c.fillStyle='#e8e8e8';c.strokeStyle=OL;c.lineWidth=0.4;c.fillRect(-0.7,4.6,1.4,5);c.fillRect(-0.7,8.2,2.6,1);c.fillStyle='#b01d1d';c.fillRect(-1.2,4,2.4,2);c.restore();c.lineWidth=1.1;c.strokeStyle=OL;}},
 ghost:{name:'Johnny Blaze',film:'Ghost Rider',notes:'Mid-transformation: Cage’s face cracking into a burning skull, hair of fire, studded black leathers and a hellfire chain.',
  head:{h:35,ax:0.56,ay:0.95},skin:'#e0a27c',skinD:'#bb7d5d',sleeve:'#26262b',sleeveD:'#151518',pants:'#1a1a1e',pantsD:'#101012',shoe:'#0c0c0c',flames:true,
  torso(c,s){torsoPath(c,-8,17,8.2,36);fillG(c,'#35353c','#141417',-8,8.2);c.fill();c.stroke();
   c.strokeStyle='#a9a9b0';c.lineWidth=0.7;c.beginPath();c.moveTo(3,17.5);c.lineTo(0.6,35.6);c.stroke();c.lineWidth=1.1;c.strokeStyle=OL;
   c.fillStyle='#d9d9df';for(const p of[[-6.5,17.6],[-4.2,17],[5.6,17],[7.4,17.8],[-6.8,21],[7.6,21]]){c.beginPath();c.moveTo(p[0]-1.1,p[1]+0.5);c.lineTo(p[0],p[1]-2.2);c.lineTo(p[0]+1.1,p[1]+0.5);c.closePath();c.fill();}
   c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,120,30,0.18)';c.beginPath();c.ellipse(1,24,8,8,0,0,6.3);c.fill();c.restore();},
  frontItem(c,hx,hy,s){const sw=Math.sin(s.t*5)*0.9+(Math.abs(s.vx)>20?0.7:0);for(let i=0;i<10;i++){const a=0.4+sw*(i/10),r=i*2.4;const x=hx+Math.sin(a)*r,y=hy+Math.cos(a)*r;c.strokeStyle=i%2?'#b0b0b6':'#7c7c84';c.lineWidth=1;c.beginPath();c.ellipse(x,y,1.4,0.85,a,0,6.3);c.stroke();
    if(i>4){c.save();c.globalCompositeOperation='lighter';c.fillStyle=`rgba(255,${120+i*8},30,${0.25+0.05*i})`;c.beginPath();c.arc(x,y,2.4,0,6.3);c.fill();c.restore();}}c.lineWidth=1.1;c.strokeStyle=OL;}},
 rock:{name:'Dr. Stanley Goodspeed',film:'The Rock',notes:'Soaked hair, manic grin, black SEAL wetsuit with blue panels — waving the green flares from the lighthouse finale when idle.',
  head:{h:35,ax:0.5,ay:0.93},skin:'#e5aa86',skinD:'#c08564',sleeve:'#1d2126',sleeveD:'#121518',pants:'#1d2126',pantsD:'#121518',shoe:'#0e1013',flares:true,
  torso(c,s){torsoPath(c,-7.6,17,7.8,36);fillG(c,'#2c3239','#121518',-7.6,7.8);c.fill();c.stroke();
   c.fillStyle='#3d7aa0';c.beginPath();c.moveTo(-7.2,21);c.lineTo(7.4,21);c.lineTo(7.4,23);c.lineTo(-7.2,23);c.closePath();c.fill();c.fillRect(-1,23,1.6,12.5);
   c.strokeStyle='rgba(255,255,255,0.25)';c.lineWidth=0.6;c.beginPath();c.moveTo(-5.6,25);c.quadraticCurveTo(-6.4,30,-5.4,34);c.stroke();c.lineWidth=1.1;c.strokeStyle=OL;}},
};
const HERO_KEYS=['conair','treasure','wicker','sixty','ghost','rock'];
function torsoPath(c,x0,y0,x1,y1){x0-=1.4;x1+=1.4;c.beginPath();c.moveTo(x0+1.5,y0);c.quadraticCurveTo(x0-0.8,y0+1,x0,y0+5);c.lineTo(x0+0.6,y1);c.lineTo(x1-0.2,y1);c.lineTo(x1+0.4,y0+5);c.quadraticCurveTo(x1+0.6,y0+1,x1-1.5,y0);c.closePath();}
function fillG(c,a,b,x0,x1){const g=c.createLinearGradient(x1,0,x0,0);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;}
function bunny(c,hx,hy,s){c.save();c.translate(hx+1,hy+2.5);c.rotate(Math.sin(s.t*2)*0.1);c.fillStyle='#f3ece6';c.strokeStyle=OL;c.lineWidth=0.7;
 c.beginPath();c.ellipse(-1.6,-9,1.3,3.8,-0.25,0,6.3);c.fill();c.stroke();c.beginPath();c.ellipse(1.6,-9,1.3,3.8,0.25,0,6.3);c.fill();c.stroke();
 c.fillStyle='#f2b7c6';c.beginPath();c.ellipse(-1.6,-9,0.5,2.4,-0.25,0,6.3);c.ellipse(1.6,-9,0.5,2.4,0.25,0,6.3);c.fill();
 c.fillStyle='#f3ece6';c.beginPath();c.ellipse(0,3,4.4,5.2,0,0,6.3);c.fill();c.stroke();c.beginPath();c.arc(0,-3.4,3.5,0,6.3);c.fill();c.stroke();
 c.fillStyle=OL;c.fillRect(-1.4,-4.2,0.8,0.8);c.fillRect(0.8,-4.2,0.8,0.8);c.fillStyle='#e07a92';c.fillRect(-0.4,-2.8,0.8,0.6);c.restore();c.lineWidth=1.1;}

function drawHero(c,key,s){const H=HEROES[key],run=Math.abs(s.vx)>20&&s.onGround,air=!s.onGround,ph=s.anim,t=s.t,idle=!run&&!air;
 let sig=0;if(idle){if(key==='rock')sig=(t%4)<2.2?1:0;if(key==='wicker')sig=(t%3.4)<1.6?1:0;}
 c.save();c.translate(s.x,s.y);c.scale(s.face,1);
 const lean=Math.min(1,Math.abs(s.vx)/260)*0.1+(s.pushing?0.25:0);c.translate(0,54);c.rotate(lean);c.translate(0,-54);
 const br=idle?Math.sin(t*2.2)*0.5:run?-Math.abs(Math.sin(ph))*1.2:0;
 c.lineCap='round';c.lineJoin='round';c.strokeStyle=OL;c.lineWidth=1.1;
 const LW=H.limbW||5.4;
 const limb=(sx,sy,a,b,l1,l2,w,col,colD,end)=>{const kx=sx+Math.sin(a)*l1,ky=sy+Math.cos(a)*l1,fx=kx+Math.sin(a-b)*l2,fy=ky+Math.cos(a-b)*l2;
  c.strokeStyle=OL;c.lineWidth=w+2.2;c.beginPath();c.moveTo(sx,sy);c.lineTo(kx,ky);c.lineTo(fx,fy);c.stroke();
  c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(sx,sy);c.lineTo(kx,ky);c.lineTo(fx,fy);c.stroke();
  if(H.fur){c.strokeStyle=colD;c.lineWidth=0.8;for(let i=1;i<4;i++){const px=sx+(kx-sx)*i/4,py=sy+(ky-sy)*i/4;c.beginPath();c.moveTo(px-w*0.3,py);c.lineTo(px-w*0.55,py+1);c.stroke();}}
  else{c.strokeStyle='rgba(255,255,255,0.18)';c.lineWidth=w*0.25;c.beginPath();c.moveTo(sx+w*0.2,sy);c.lineTo(kx+w*0.2,ky);c.stroke();}
  c.strokeStyle=OL;c.lineWidth=1.1;return[fx,fy];};
 const hand=(x,y)=>{c.fillStyle=H.fur?'#3b2414':H.skin;c.beginPath();c.arc(x,y,H.fur?2.8:2.2,0,6.3);c.fill();c.stroke();};
 const foot=(x,y)=>{c.fillStyle=H.shoe;c.beginPath();c.moveTo(x-2.6,y+0.6);c.lineTo(x-2.4,y-2.4);c.quadraticCurveTo(x+3.5,y-2.6,x+5,y+0.6);c.closePath();c.fill();c.stroke();};
 const legAng=(back)=>{const o=back?Math.PI:0;if(air)return back?[-0.5,-0.2]:[0.6,-1.0];if(run)return[Math.sin(ph+o)*0.75,-Math.max(0,Math.sin(ph+o+1.3))*1.1];return[back?-0.14:0.14,0.05];};
 const armAng=(back)=>{const o=back?Math.PI:0;
  if(key==='rock'&&sig)return back?[-2.75+Math.sin(t*7)*0.25,-0.3]:[1.55+Math.sin(t*7+1.5)*0.25,-0.7];
  if(key==='wicker'&&sig)return back?[-2.1+Math.sin(t*15)*0.5,-0.5]:[2.1+Math.sin(t*15+2)*0.5,0.5];
  if(s.pushing)return[1.7,-0.2];if(air)return back?[2.4,-0.5]:[-0.6,-0.5];if(run)return[-Math.sin(ph+o)*0.8,-0.7];
  if(key==='sixty'&&!back)return[0.35,-1.2];if(key==='treasure'&&!back)return[0.25,-0.9];if(key==='conair'&&!back)return[0.55,-1.5];if(key==='ghost'&&!back)return[0.15,-0.3];
  return[back?0.18:-0.12,-0.4];};
 const hipY=35,l1=9.5,l2=54-hipY-l1-1.4;
 const sleeve=H.sleeve||H.skin,sleeveD=H.sleeveD||H.skinD;
 // back arm + leg
 let a=armAng(true);const bh=limb(-2.5,19.5+br,a[0],a[1],8.5,8,LW-0.4,sleeveD,'#3b2414');hand(bh[0],bh[1]);if(H.backItem)H.backItem(c,bh[0],bh[1],s);if(H.flares)flare(c,bh[0],bh[1],s,2);
 a=legAng(true);let ft=limb(-2,hipY,a[0],-a[1],l1,l2,LW+0.8,H.pantsD,'#3b2414');foot(ft[0],ft[1]);
 a=legAng(false);ft=limb(2,hipY,a[0],-a[1],l1,l2,LW+0.8,H.pants,H.pantsD);foot(ft[0],ft[1]);
 // flames behind head
 if(H.flames){c.save();c.globalCompositeOperation='lighter';for(let i=0;i<8;i++){const p=t*7+i*1.9,h=12+Math.sin(p)*4+(i%3)*3,x=-9+i*2.6+Math.sin(p*0.7)*1.5,ln=(Math.abs(s.vx)>20?-5:0)-2;
   const g=c.createLinearGradient(0,0,0,-h-8);g.addColorStop(0,'rgba(255,210,110,0.85)');g.addColorStop(0.5,'rgba(255,110,25,0.6)');g.addColorStop(1,'rgba(255,40,0,0)');c.fillStyle=g;c.beginPath();c.moveTo(x-3,2);c.quadraticCurveTo(x-2+ln*0.3,-6-h*0.3,x+ln,-6-h);c.quadraticCurveTo(x+3,-6-h*0.3,x+3,2);c.fill();}c.restore();}
 // torso
 c.save();c.translate(0,br*0.5);H.torso(c,s);c.restore();
 // head (painted)
 const HI=HEAD_IMG[key];if(HI&&HI.img.complete&&HI.img.naturalWidth){const hh=H.head.h,hw=hh*HI.w/HI.h;let tilt=run?0.08:air?(s.vy<0?-0.12:0.06):Math.sin(t*1.3)*0.03;if(key==='wicker'&&sig)tilt+=Math.sin(t*40)*0.05;
  c.save();c.translate(1.2,19+br);c.rotate(tilt);c.drawImage(HI.img,-hw*H.head.ax,-hh*H.head.ay,hw,hh);c.restore();}
 // front arm
 a=armAng(false);const fh=limb(2.5,19.5+br,a[0],a[1],8.5,8,LW,sleeve,sleeveD);hand(fh[0],fh[1]);if(H.frontItem)H.frontItem(c,fh[0],fh[1],s);if(H.flares)flare(c,fh[0],fh[1],s,0);
 if(H.bees&&(sig||air))bees(c,t);
 if(H.flames&&Math.random()<0.5){c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,180,60,0.8)';c.fillRect(-8+Math.random()*16,-14-Math.random()*10,0.9,0.9);c.restore();}
 c.restore();}
function flare(c,hx,hy,s,ph){c.save();c.translate(hx,hy);c.fillStyle='#b8231d';c.strokeStyle=OL;c.lineWidth=0.6;c.fillRect(-1.1,-3,2.2,8);c.strokeRect(-1.1,-3,2.2,8);c.globalCompositeOperation='lighter';const f=0.8+0.2*Math.sin(s.t*31+ph);
 const g=c.createRadialGradient(0,-4,0,0,-4,8*f);g.addColorStop(0,'rgba(240,255,230,1)');g.addColorStop(0.25,'rgba(90,255,90,0.85)');g.addColorStop(1,'rgba(40,255,60,0)');c.fillStyle=g;c.beginPath();c.arc(0,-4,8*f,0,6.3);c.fill();c.restore();}

  c.fillStyle='rgba(230,240,255,0.75)';c.beginPath();c.ellipse(-0.5,-1.6+Math.sin(t*60+i)*0.4,1.2,0.8,-0.5,0,6.3);c.fill();c.fillStyle='#f2c230';c.strokeStyle=OL;c.lineWidth=0.4;c.beginPath();c.ellipse(0,0,1.7,1.15,0,0,6.3);c.fill();c.stroke();c.fillStyle=OL;c.fillRect(-0.4,-1.1,0.6,2.2);c.restore();}}
